name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [user-service, product-service, order-service]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (${{ matrix.service }})
        run: |
          cd ${{ matrix.service }}
          pip install -r requirements.txt

      - name: Run tests (${{ matrix.service }})
        run: |
          cd ${{ matrix.service }}
          pytest tests/ -v

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        service: [user-service, product-service, order-service]

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image (${{ matrix.service }})
        run: |
          docker build -t ${{ matrix.service }}:ci ./${{ matrix.service }}

